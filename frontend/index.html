<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigitVision: Handwritten Digit Recognizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>DigitVision</h1>
            <p>Draw a digit (0-9) below to test the CNN.</p>
        </header>

        <main class="app-layout">
            <section class="canvas-section">
                <!-- Canvas dimension set to 280x280 (10x larger than 28x28 MNIST) -->
                <canvas id="drawingCanvas" width="280" height="280"></canvas>
                
                <div class="controls">
                    <div class="brush-slider">
                        <label for="brushSize">Brush:</label>
                        <input type="range" id="brushSize" min="10" max="40" value="25">
                    </div>
                    <button id="clearBtn">Clear</button>
                    <button id="predictBtn" class="primary">Predict</button>
                </div>
            </section>

            <section class="results-section">
                <div class="main-result">
                    <div id="prediction">?</div>
                    <div id="confidence">Confidence: --%</div>
                    <div id="statusMessage"></div>
                </div>

                <div class="bars-container" id="barsContainer">
                    <!-- Probability bars generated by JS -->
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
